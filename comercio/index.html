<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GranCred Comercio</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A3D91">
<link rel="apple-touch-icon" href="icons/gc-apple-touch-icon.png">

<style>
html,body{
height:100%;
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#ffffff;
display:flex;
justify-content:center;
align-items:center;
}

.container{
text-align:center;
}

img{
width:90px;
margin-bottom:20px;
}

h2{
margin:0;
color:#0A3D91;
}

p{
color:#666;
margin-top:8px;
}

.loader{
margin:30px auto 0;
width:38px;
height:38px;
border:4px solid #ddd;
border-top:4px solid #0A3D91;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}
</style>

<script>

if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('service-worker.js');
});
}

setTimeout(function(){

window.location.replace("https://script.google.com/macros/s/AKfycbwwTMyny0cqcgk94SZHAySRkhMRxxEMRIR6fFz47Arw70RFbbpzuLcOimMUEgVputzaLw/exec");

},1200);

</script>

</head>

<body>

<div class="container">

<img src="icons/gc-icon-192.png">

<h2>GranCred Comercio</h2>

<p>Iniciando plataforma...</p>

<div class="loader"></div>

</div>

</body>
</html>
